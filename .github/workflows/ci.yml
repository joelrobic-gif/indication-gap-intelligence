name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Unit tests (engine core)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Security audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true
